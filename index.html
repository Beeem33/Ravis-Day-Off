<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ravi's Day Off</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: 'Consolas', 'Courier New', monospace; user-select: none; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    #ui-root .clickable { pointer-events: auto; }

    /* ---------- Menu terminal ---------- */
    .menu-terminal {
      position: absolute; left: 4vw; bottom: 6vh; width: min(420px, 86vw);
      background: rgba(3, 12, 5, 0.82); border: 1px solid #1f5c2a;
      box-shadow: 0 0 24px rgba(30, 220, 90, 0.18), inset 0 0 40px rgba(0,0,0,0.6);
      color: #52e07a; padding: 18px 22px; pointer-events: auto;
      text-shadow: 0 0 6px rgba(82, 224, 122, 0.55);
    }
    .menu-terminal h1 { font-size: 20px; letter-spacing: 2px; margin-bottom: 2px; }
    .menu-terminal .sub { font-size: 11px; color: #2e8f47; margin-bottom: 14px; }
    .menu-terminal .divider { border-top: 1px dashed #1f5c2a; margin: 10px 0; }
    .menu-item {
      display: block; width: 100%; text-align: left; background: none; border: none;
      color: #52e07a; font: inherit; font-size: 15px; padding: 7px 4px; cursor: pointer;
      letter-spacing: 1px; text-shadow: inherit;
    }
    .menu-item:hover, .menu-item.focused { background: rgba(82, 224, 122, 0.14); color: #b8ffcf; }
    .menu-item::before { content: '> '; opacity: 0; }
    .menu-item:hover::before, .menu-item.focused::before { opacity: 1; }
    .menu-panel { font-size: 12px; color: #7de99a; padding: 6px 4px; }
    .menu-panel table { width: 100%; border-collapse: collapse; }
    .menu-panel td { padding: 3px 2px; font-size: 12px; }
    .menu-panel td:first-child { color: #2e8f47; width: 46%; }
    .menu-panel input[type=range] { width: 100%; accent-color: #52e07a; }
    .blink { animation: blink 1.1s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* ---------- HUD ---------- */
    #hud { position: absolute; inset: 0; display: none; }
    .crosshair {
      position: absolute; left: 50%; top: 50%; width: 0; height: 0;
    }
    .crosshair span { position: absolute; background: #ffffff; box-shadow: 0 0 3px rgba(0,0,0,0.9); }
    /* Plain white dot — the arms are kept in the markup but hidden */
    .ch-t, .ch-b, .ch-l, .ch-r { display: none; }
    .ch-dot { width: 4px; height: 4px; left: -2px; top: -2px; border-radius: 50%; }
    .hitmarker {
      position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0;
    }
    .hitmarker span { position: absolute; width: 11px; height: 2px; background: #ff3131; box-shadow: 0 0 4px #ff3131; }
    .hm1 { transform: rotate(45deg) translate(8px, -8px); }
    .hm2 { transform: rotate(-45deg) translate(-8px, -8px); }
    .hm3 { transform: rotate(-45deg) translate(8px, 8px); }
    .hm4 { transform: rotate(45deg) translate(-8px, 8px); }
    .hitmarker.show { opacity: 1; transition: none; }
    .hitmarker.fade { opacity: 0; transition: opacity 0.35s; }

    .hud-topleft {
      position: absolute; left: 24px; top: 20px; color: #e8f4ec; font-size: 14px;
      letter-spacing: 1.5px; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .hud-topleft .big { font-size: 26px; color: #ff5941; font-weight: bold; }
    .hud-health {
      position: absolute; left: 24px; bottom: 44px; display: flex; align-items: center; gap: 10px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .hud-health .hp-label {
      color: rgba(232,244,236,0.75); font-size: 12px; letter-spacing: 1.5px;
    }
    .hud-health .hp-track {
      position: relative; width: 186px; height: 13px; overflow: hidden;
      background: rgba(6,10,8,0.72); border: 1px solid rgba(232,244,236,0.34);
      box-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    .hud-health .hp-fill, .hud-health .hp-regen {
      position: absolute; left: 0; top: 0; height: 100%;
      transition: width 0.22s ease-out, background 0.25s, box-shadow 0.25s;
    }
    .hud-health .hp-fill {
      background: linear-gradient(#8dffb8, #43d477);
      box-shadow: 0 0 9px rgba(108,245,154,0.5);
    }
    /* Regen creeps in behind the solid fill */
    .hud-health .hp-regen { background: rgba(108,245,154,0.22); transition: width 0.35s linear; }
    .hud-health .hp-ticks { position: absolute; inset: 0; display: flex; }
    .hud-health .hp-ticks span {
      flex: 1; border-right: 1px solid rgba(6,10,8,0.75);
    }
    .hud-health .hp-ticks span:last-child { border-right: none; }
    .hud-health .hp-num {
      color: rgba(232,244,236,0.85); font-size: 12px; letter-spacing: 1px; min-width: 42px;
    }
    .hud-health.critical .hp-fill {
      background: linear-gradient(#ff7a6a, #e02020); box-shadow: 0 0 10px rgba(255,59,59,0.65);
    }
    .hud-health.critical .hp-regen { background: rgba(255,90,70,0.22); }
    .hud-health.critical .hp-label, .hud-health.critical .hp-num { color: #ff8a7a; }
    .hud-health.healed .hp-track { animation: hp-heal 0.5s ease-out; }
    @keyframes hp-heal {
      0% { box-shadow: 0 0 0 rgba(160,255,200,0); }
      35% { box-shadow: 0 0 14px rgba(160,255,200,0.9); }
      100% { box-shadow: 0 1px 4px rgba(0,0,0,0.8); }
    }
    .killfeed {
      position: absolute; right: 24px; top: 20px; text-align: right; font-size: 12.5px;
      color: #ffd9d0; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .killfeed div { margin-bottom: 4px; opacity: 1; transition: opacity 1.2s; }
    .killfeed div.old { opacity: 0; }
    .killfeed .you { color: #7cf59a; }
    .hud-ammo {
      position: absolute; right: 24px; bottom: 18px; text-align: right; color: #e8f4ec;
      font-size: 13px; letter-spacing: 2px; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .hud-ammo .rounds { font-size: 30px; font-weight: bold; line-height: 1; }
    .hud-ammo.low .rounds { color: #ff5941; }
    .hud-ammo.reloading .rounds { color: #9aa89e; animation: blink 0.5s steps(2) infinite; }
    .hud-bottom {
      position: absolute; left: 24px; bottom: 18px; color: rgba(232,244,236,0.75);
      font-size: 12px; letter-spacing: 1px; text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .alert-banner {
      position: absolute; left: 50%; top: 17%; transform: translateX(-50%);
      color: #ffb42e; font-size: 15px; letter-spacing: 3px; opacity: 0;
      text-shadow: 0 0 8px rgba(255,180,46,0.7); transition: opacity 0.25s;
    }
    .alert-banner.show { opacity: 1; }

    /* ---------- Intro level: letterbox, objective, wipe ---------- */
    #intro-ui { position: absolute; inset: 0; pointer-events: none; }
    .intro-letterbox span {
      position: absolute; left: 0; right: 0; height: 12vh; background: #000;
      transition: height 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .intro-letterbox .lb-top { top: 0; }
    .intro-letterbox .lb-bot { bottom: 0; }
    .intro-letterbox.open span { height: 0; }
    .intro-skip {
      position: absolute; right: 26px; bottom: 14vh; color: rgba(232,244,236,0.55);
      font-size: 12px; letter-spacing: 2px; transition: opacity 0.4s;
    }
    .intro-skip.gone { opacity: 0; }
    .intro-objective {
      position: absolute; left: 50%; top: 21%; transform: translateX(-50%);
      color: #e8f4ec; font-size: 15px; letter-spacing: 3px; text-align: center;
      text-shadow: 0 0 10px rgba(0,0,0,0.95); opacity: 0; white-space: nowrap;
    }
    .intro-objective.show { animation: obj-in 5s ease-out forwards; }
    @keyframes obj-in {
      0% { opacity: 0; }
      8% { opacity: 1; }
      75% { opacity: 1; }
      100% { opacity: 0; }
    }
    .intro-fade {
      position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none;
    }

    /* ---------- Dialogue box ---------- */
    .dialogue-box {
      position: absolute; left: 50%; bottom: 9vh; transform: translateX(-50%) translateY(14px);
      width: min(720px, 88vw); min-height: 118px; padding: 16px 22px 30px;
      background: #050608; border: 4px solid #f0efe9; border-radius: 3px;
      color: #f0efe9; opacity: 0; pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
      box-shadow: 0 0 0 4px #050608, 0 8px 26px rgba(0,0,0,0.7);
    }
    .dialogue-box.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .dialogue-box .dlg-name {
      color: #ffd85e; font-size: 14px; letter-spacing: 2px; margin-bottom: 8px;
    }
    .dialogue-box .dlg-text {
      font-size: 19px; line-height: 1.5; letter-spacing: 0.5px; white-space: pre-wrap;
      min-height: 58px;
    }
    .dialogue-box .dlg-prompt {
      position: absolute; right: 18px; bottom: 10px; color: #f0efe9; font-size: 16px;
      opacity: 0; animation: dlg-bob 0.75s ease-in-out infinite;
    }
    @keyframes dlg-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

    /* ---------- Death / Win overlays ---------- */
    .fullscreen-overlay {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; pointer-events: auto;
    }
    #death-overlay { background: radial-gradient(ellipse at center, rgba(60,0,0,0.35) 0%, rgba(25,0,0,0.88) 100%); }
    #death-overlay h2 { color: #ff2b2b; font-size: 52px; letter-spacing: 8px; text-shadow: 0 0 24px rgba(255,0,0,0.6); }
    #death-overlay p, #win-overlay p { color: #d9c9c9; margin-top: 14px; font-size: 15px; letter-spacing: 1px; }
    #win-overlay { background: radial-gradient(ellipse at center, rgba(6,28,10,0.45) 0%, rgba(2,12,4,0.92) 100%); }
    #win-overlay h2 { color: #6cf59a; font-size: 44px; letter-spacing: 6px; text-shadow: 0 0 24px rgba(80,255,140,0.5); }
    .overlay-hint { margin-top: 30px; color: #9aa89e; font-size: 13px; letter-spacing: 2px; }

    /* Vignette while playing */
    #vignette {
      position: absolute; inset: 0; display: none;
      background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,0.42) 100%);
    }
    #damage-flash { position: absolute; inset: 0; background: rgba(180,0,0,0.0); pointer-events: none; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ui-root"></div>

  <!-- Boot splash: "Made With Claude" → "CLANKER Studio", then the menu -->
  <style>
    #boot-splash {
      position: fixed; inset: 0; background: #000; z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.8s;
    }
    #boot-splash .card {
      position: absolute; display: flex; flex-direction: column; align-items: center; gap: 26px;
      opacity: 0; transition: opacity 0.8s;
      font-family: 'Courier New', monospace; color: #e8e4dc; letter-spacing: 3px; text-align: center;
    }
    #boot-splash .card.show { opacity: 1; }
    #boot-splash .claude-mark { width: 84px; height: 84px; }
    #boot-splash .made { font-size: 17px; color: #cfc9bd; }
    #boot-splash .by { font-size: 13px; color: #77726a; letter-spacing: 4px; }
    #boot-splash .studio { font-size: 30px; font-weight: bold; color: #e8e4dc; letter-spacing: 8px; }
  </style>
  <div id="boot-splash">
    <div class="card" id="splash-claude">
      <svg class="claude-mark" viewBox="0 0 100 100" aria-hidden="true">
        <!-- Claude starburst -->
        <g fill="#D97757">
          <g id="ray"><rect x="46.5" y="4" width="7" height="30" rx="3.5"></rect></g>
          <use href="#ray" transform="rotate(30 50 50)"></use>
          <use href="#ray" transform="rotate(60 50 50)"></use>
          <use href="#ray" transform="rotate(90 50 50)"></use>
          <use href="#ray" transform="rotate(120 50 50)"></use>
          <use href="#ray" transform="rotate(150 50 50)"></use>
          <use href="#ray" transform="rotate(180 50 50)"></use>
          <use href="#ray" transform="rotate(210 50 50)"></use>
          <use href="#ray" transform="rotate(240 50 50)"></use>
          <use href="#ray" transform="rotate(270 50 50)"></use>
          <use href="#ray" transform="rotate(300 50 50)"></use>
          <use href="#ray" transform="rotate(330 50 50)"></use>
        </g>
      </svg>
      <div class="made">Made With Claude</div>
    </div>
    <div class="card" id="splash-studio">
      <div class="by">made by:</div>
      <div class="studio">CLANKER STUDIO</div>
    </div>
  </div>
  <script>
    (() => {
      const splash = document.getElementById('boot-splash');
      const a = document.getElementById('splash-claude');
      const b = document.getElementById('splash-studio');
      requestAnimationFrame(() => a.classList.add('show'));
      setTimeout(() => a.classList.remove('show'), 3000); // fade Claude card away
      setTimeout(() => b.classList.add('show'), 3800); // fade the studio card in
      setTimeout(() => b.classList.remove('show'), 6300);
      setTimeout(() => { splash.style.opacity = '0'; }, 6600); // reveal the menu underneath
      setTimeout(() => splash.remove(), 7500);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
